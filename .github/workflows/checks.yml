name: Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: titikapi
          POSTGRES_PASSWORD: titikapi
          POSTGRES_DB: titikapi_test
        ports: [5442:5432]
        options: >-
          --health-cmd "pg_isready -U titikapi -d titikapi_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://titikapi:titikapi@localhost:5442/titikapi_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.0.0
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true
      - run: pnpm --filter @titikapi/api check
      - run: pnpm --filter @titikapi/api test
      - run: pnpm --filter @titikapi/api build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/setup@v3.0.0
        with:
          node-version-file: .node-version
          cache: true
          require-lockfile: true
      - run: pnpm --filter @titikapi/web test
      - run: pnpm --filter @titikapi/web build
